[project]
name = "fashion-commerce-analytics-platform"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "dagster>=1.13.24",
    "dagster-dbt>=0.29.24",
    "dagster-webserver>=1.13.24",
    "dbt-duckdb>=1.11.0",
    "duckdb>=1.5.6",
    "holidays>=0.106",
    "joblib>=1.6.0",
    "kaggle>=2.2.4",
    "lightgbm>=4.7.0",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "shap>=0.51.0",
    "streamlit>=1.64.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "sqlfluff>=4.3.0",
]

[tool.ruff]
extend-exclude = ["notebooks"]
line-length = 88

[tool.ruff.format]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
